MEMORY {
  RAM: start=$1000, size = $5000, type = rw;
  RAM2: start= $10000, size = $70000, type = rw;
}

SEGMENTS {
  CODE: load = "RAM", type = rw;
  CODE2: load = "RAM2", type = rw;
  RODATA: load = "RAM2", type = ro;
  DATA: load = "RAM2", type = rw;
  BSS: load = "RAM2", type = bss, define = yes;
}
